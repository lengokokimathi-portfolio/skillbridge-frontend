<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>HEXCORE SKILLBRIDGE — Where Skills Meet Needs.</title>
<meta name="theme-color" content="#040814">
<style>
:root{--bg:#040814;--p:#0a1226;--p2:#0e1a36;--b:#16294f;--tx:#f1f5ff;--mu:#8a9bc0;--bl:#3b82f6;--vi:#8b5cf6;--gr:#10b981;--am:#f59e0b;--rd:#f43f5e}
*{box-sizing:border-box;margin:0}
[id]{scroll-margin-top:70px}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
a{color:inherit;text-decoration:none;cursor:pointer}

.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}

.hex{width:32px;height:32px;display:grid;place-items:center;background:linear-gradient(135deg,var(--bl),var(--vi));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--bl);color:#fff;transition:.2s;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}

.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:none}

.back{display:none}
.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}

select option{background:#0e1a36}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}

.burger{display:none;background:none;border:1px solid var(--b);border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer}
.mmenu{display:none}

.cat .ico{margin:0 auto 10px}

footer{padding:50px 5% 30px;border-top:1px solid var(--b);color:var(--mu)}
.fcols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}
footer h4{color:var(--tx);margin-bottom:12px}footer .fl{display:block;padding:5px 0;color:var(--mu)}footer .fl:hover{color:#fff}
.fbot{margin-top:30px;padding-top:18px;border-top:1px solid var(--b);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pubp{max-width:860px;margin:0 auto;padding:60px 5%}.pubp h1{font-size:36px;margin-bottom:8px}.pubp h2{margin-top:26px;font-size:20px}.pubp p{color:var(--mu);margin:10px 0}
details.faq{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px 18px;margin-bottom:10px}details.faq summary{cursor:pointer;font-weight:600}details.faq p{margin:10px 0 0}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 10%,rgba(139,92,246,.25),transparent 50%)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px 6px;border-radius:10px;border:1px solid var(--b);background:var(--p2);cursor:pointer;font-size:14px;min-height:44px}
.seg button.on{border-color:var(--bl);background:rgba(59,130,246,.25);color:#93c5fd;font-weight:700}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.app.col{grid-template-columns:76px 1fr}
.side{background:#050b1c;border-right:1px solid var(--b);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.side a,.side .nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);font-size:15px;cursor:pointer}
.side a:hover{background:var(--p2);color:#fff}.side a.on{background:rgba(59,130,246,.18);color:#60a5fa;font-weight:600}
.col .lbl,.col .uinfo,.col .badge,.col .lt{display:none}.col .side a{justify-content:center}.col .side .logo{justify-content:center}
.badge{margin-left:auto;background:var(--vi);color:#fff;border-radius:99px;font-size:12px;min-width:22px;text-align:center;padding:1px 7px}.badge.b{background:var(--bl)}
.main{padding:32px;max-width:1200px;width:100%}
.stat{display:flex;flex-direction:column;gap:6px}.stat h2{font-size:30px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--b)}.item:last-child{border:0}
.bar{height:8px;background:var(--p2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--vi))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--b);background:var(--p);cursor:pointer;font-size:14px}.chip.on{background:var(--bl);border-color:var(--bl)}
.msgs{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 150px);min-height:480px;padding:0;overflow:hidden}
.conv{border-right:1px solid var(--b);overflow:auto}.conv .item{padding:14px 16px;cursor:pointer}.conv .item.on{background:var(--p2)}
.chat{display:flex;flex-direction:column;min-width:0}.chat .log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}

.empty{text-align:center;padding:40px;color:var(--mu)}
.bnav,.amob{display:none}
.spin{width:28px;height:28px;border:3px solid var(--b);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(2,5,14,.75);display:grid;place-items:center;z-index:50;padding:16px}

.plan ul{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;color:var(--mu);font-size:14px}
.plan.hot{border-color:var(--vi);box-shadow:0 0 0 1px var(--vi),0 8px 30px rgba(139,92,246,.25)}
.tog{position:relative;width:46px;height:26px;flex:none}

.tgl{display:flex;margin:0;padding:14px 0;border-bottom:1px solid var(--b);font-weight:400;gap:16px;align-items:center;justify-content:space-between}
.dist{display:grid;grid-template-columns:16px 1fr 22px;gap:8px;align-items:center;font-size:13px}
.tile{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;font-size:32px}
.tabs a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer}.tabs a.on{background:var(--bl);color:#fff;font-weight:600}
@media(max-width:900px){

body{background:radial-gradient(1100px 560px at 85% -10%,rgba(139,92,246,.14),transparent 60%),radial-gradient(900px 500px at -10% 105%,rgba(59,130,246,.12),transparent 60%),var(--bg);background-attachment:fixed}

  find() {
    const q = S.q.toLowerCase().trim();
    const syn = {web: ['web','website','developer','react','interface'], design: ['design','graphic','brand'], plumb: ['plumb','pipe'], tutor: ['tutor','math','teach']};
    let toks = q.split(/\s+/).filter(Boolean), ex = [];
    toks.forEach(t => Object.keys(syn).forEach(k => { if (t.startsWith(k)) ex.push(...syn[k]); }));
    
    let list = S.P.map(p => {
      const h = (p.s + ' ' + p.t.join(' ') + ' ' + p.d + ' ' + p.c).toLowerCase();
      let sc = 0;
      toks.forEach(t => { if (h.includes(t)) sc += 5; });
      ex.forEach(t => { if (h.includes(t)) sc += 2; });
      if (p.l.split(',')[0] == S.user.loc.split(',')[0]) sc += 2;
      if (p.a) sc += 2;
      sc += p.x / 4 + p.rt;
      return {p, sc, m: !toks.length || toks.some(t => h.includes(t)) || ex.some(t => h.includes(t))};
    }).filter(r => r.m && (S.cat == 'All' || r.p.c == S.cat) && (!S.avail || (S.avail == 'a' ? r.p.a : !r.p.a)) && (!S.loc || r.p.l.startsWith(S.loc)) && (!S.exp || (S.exp == 'lt' ? r.p.x < 3 : S.exp == 'mid' ? r.p.x >= 3 && r.p.x <= 5 : r.p.x > 5)) && (!S.sty || r.p.ty == S.sty || r.p.ty == 'Both'));
    
    if (S.sort == 'rt') list.sort((a,b) => b.p.rt - a.p.rt);
    else if (S.sort == 'x') list.sort((a,b) => b.p.x - a.p.x);
    else list.sort((a,b) => b.sc - a.sc);
    
    const nf = [S.cat != 'All', S.avail, S.loc, S.exp, S.sty].filter(Boolean).length;
    
    return head('Find a Skill', 'Discover skilled professionals ready to help you.') + `<form data-f="search" class="row"><input id="q" value="${esc(S.q)}" placeholder="What skill or service are you looking for?"><button class="btn">Search</button><button type="button" class="btn o" data-a="fopen">⚙ Filters${nf ? ' (' + nf + ')' : ''}</button></form>

  if (!m) return '';

  if (m.t == 'more') {
    cls += ' sheet';
    c = `<div class="grid g2" style="gap:6px">${NAV.map(n => `<a href="#/app/${n[0]}" class="item" style="border:0;padding:12px 8px"><span>${n[1]}</span>${n[2]}${bdg(n[0])}</a>`).join('')}<a data-a="logout" class="item" style="border:0;padding:12px 8px"><span>⏻</span>Logout</a></div>`;

    c = `<form data-f="reportsend" novalidate><h3>Report ${p.n}</h3><label>Reason</label><select name="why"><option>Spam or scam</option><option>Misleading profile</option><option>Inappropriate behavior</option><option>Other</option></select><label>Details</label><textarea name="d" rows="3" placeholder="Tell us what happened"></textarea><div class="err" id="e-d"></div><div class="row" style="margin-top:18px">${X}<button class="btn r" style="flex:1">Submit report</button></div></form>`;
  } else if (m.t == 'apply') {
    const o = S.opps.find(x => x.id == m.id);
    c = `<form data-f="applysend" novalidate><h3>Apply: ${esc(o.t)}</h3><div class="bl" style="font-size:14px">${esc(o.o)}</div><label>Why are you a good fit?</label><textarea name="m" rows="4" placeholder="Share your experience and availability"></textarea><div class="err" id="e-m"></div><div class="row" style="margin-top:18px">${X}<button class="btn" style="flex:1">Send application</button></div></form>`;

  } else if (m.t == 'done') {

  } else if (m.t == 'user') {

  } else if (m.t == 'inv') {
    const r = S.reports[m.i];
    c = `<h3>Report #${r.id}</h3><div class="item"><span class="mu">Subject</span><b style="margin-left:auto">${esc(r.w)}</b></div><div class="item"><span class="mu">Type</span><b style="margin-left:auto">${r.ty}</b></div><div class="item"><span class="mu">Reason</span><b style="margin-left:auto">${esc(r.why)}</b></div><div class="item"><span class="mu">Reported by</span><b style="margin-left:auto">${esc(r.by)} · ${r.d}</b></div><p class="mu" style="margin:10px 0">${esc(r.det || '')}</p><div class="row wrap"><button class="btn o s" data-a="rdis" data-v="${m.i}">Dismiss</button><button class="btn o s" data-a="rwarn" data-v="${m.i}">Warn user</button><button class="btn r s" data-a="rban" data-v="${m.i}">${r.ty == 'User' ? 'Suspend user' : 'Remove content'}</button><button class="btn o s" data-a="closem">Close</button></div>`;
  }
  
  return `<div class="${cls}" data-a="closem" role="dialog" aria-modal="true"><div class="card">${c}</div></div>`;
}

  '/contact': contact,

function render() {
  const h = location.hash.slice(1) || '/';
  const a = h.split('/');
  let html;
  
  if (h == '/signup') {
    S.signRole = 'Both';
    html = signup();
  } else if (PUB[h]) {
    html = PUB[h]();
  } else if (h == '/admin') {
    if (!S.admin) {
      go('/admin-login');
      return;
    }
    html = admin();
  } else if (a[1] == 'app') {
    if (!S.logged) {
      go('/login');
      return;
    }
    const pg = a[2] || 'dashboard';
    html = shell(pg, (pages[pg] || pages.dashboard)(a[3]));
  } else {
    html = landing();
  }
  
  root.innerHTML = html;
  window.scrollTo(0,0);
  decorate();
  const l = $('#log');
  if (l) l.scrollTop = l.scrollHeight;
}

window.addEventListener('hashchange', () => {
  S.modal = null;
  render();
});

const re = () => {
  const y = scrollY;
  render();
  scrollTo(0, y);
};

const keepq = () => {
  const q = $('#q');
  if (q) S.q = q.value;
};

function done(ic, title, msg, btns) {
  S.modal = {t: 'done', ic, title, msg, btns};
  re();
}

function simAccept(id) {
  setTimeout(() => {
    if (!S.logged || !S.sent.some(s => s.id == id)) return;
    const p = prov(id);
    if (!p.a) return;
    
    S.sent = S.sent.filter(s => s.id != id);
    S.conns.push(id);
    S.cdate[id] = TODAY;
    S.chats[id] = [['t','Hi! Thanks for connecting. How can I help?','Now']];
    S.unread[id] = 1;
    
    S.notes.unshift({i: '✓', m: `${p.n} accepted your connection request.`, w: 'Just now', n: 1, l: '#/app/connections'});
    toast(`✓ ${p.n} accepted your request`);
    
    if (/#\/app\/(requests|connections|dashboard|notifications|find)/.test(location.hash) && !S.modal) re();
  }, 5000);
}

function saveSkill(f, status) {
  const v = n => f[n]?.value.trim();
  const dr = status == 'Draft';
  const e = {
    t: !v('t') ? 'Title is required' : '',
    c: !dr && !v('c') ? 'Choose a category' : '',
    d: !dr && v('d').length < 20 ? 'Describe your skill (at least 20 characters)' : ''
  };
  
  if (!showE(f, e)) return;
  
  const id = +v('id');
  const o = {
    t: v('t'),
    c: v('c') || 'Other',
    d: v('d'),
    ty: v('ty'),
    exp: v('exp'),
    loc: v('loc'),
    av: v('av'),
    rate: v('rate'),
    ct: v('ct'),
    st: status
  };
  
  if (f.files && f.files.files.length) S.portfolio = true;
  
  if (id) {
    Object.assign(S.skills.find(s => s.id == id), o);
    toast(dr ? 'Draft saved' : 'Skill updated');
  } else {
    S.skills.push({id: Date.now(), v: 0, r: 0, ...o});
    toast(dr ? 'Saved as draft' : 'Skill published!');
  }
  
  go('/app/myskills');
}

  if (!t || t.tagName == 'SELECT') return;
  A[t.dataset.a]?.(t.dataset.v, t, e);
});

document.addEventListener('keydown', e => {
  if (e.key == 'Escape' && S.modal) {
    S.modal = null;
    re();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  const d = t.dataset || {};
  
  if (t.tagName == 'SELECT' && d.a) {
    A[d.a](d.v, t);
    return;
  }
  
  if (d.pref !== undefined) {
    S.prefs[d.pref] = t.checked ? 1 : 0;
    toast('Preference saved');
    return;
  }
  
  if (d.apref !== undefined) {
    S.aprefs[d.apref] = t.checked ? 1 : 0;
    toast('Setting saved');
    return;
  }
  
  if (d.photo !== undefined && t.files[0]) {
    const f = t.files[0];
    if (!f.type.startsWith('image/') || f.size > 5 * 1024 * 1024) {
      toast('Choose a JPG or PNG under 5MB', 1);
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      S.user.photo = r.result;
      document.querySelectorAll('[data-uav]').forEach(el => el.innerHTML = uavIn(+el.dataset.uav));
      toast('Photo updated');
    };
    r.readAsDataURL(f);
  }
  
  if (d.att !== undefined && t.files[0]) {
    const f = t.files[0];
    const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    if (f.size > 10 * 1024 * 1024) {
      toast('File must be under 10MB', 1);
      return;
    }
    S.chats[S.chat].push(['m', `📎 ${f.name} (${Math.max(1, Math.round(f.size/1024))} KB)`, now]);
    re();
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  const d = t.dataset || {};
  
  if (d.in) {
    S[d.in] = t.value;
    const p = t.selectionStart;
    re();
    const n = document.querySelector(`[data-in=${d.in}]`);
    if (n) {
      n.focus();
      n.setSelectionRange(p, p);
    }
  }
  
  if (d.pv) {
    const el = $('#pv-' + d.pv);
    if (el) el.textContent = t.value || el.dataset.ph || '';
  }
  
  if (d.pw !== undefined) {
    const p = t.value;
    let n = 0;
    if (p.length >= 8) n++;
    if (/[A-Z]/.test(p) && /[a-z]/.test(p)) n++;
    if (/\d/.test(p)) n++;
    if (/[^A-Za-z0-9]/.test(p)) n++;
    
    const L = [['Weak password','#f43f5e',25],['Weak password','#f43f5e',25],['Fair password','#f59e0b',50],['Good password','#3b82f6',75],['Strong password','#10b981',100]][n];
    const m = $('#pwm'), l = $('#pwl');
    if (m && l) {
      if (!p) {
        m.style.width = '0';
        l.textContent = '';
      } else {
        m.style.width = L[2] + '%';
        m.style.background = L[1];
        l.textContent = L[0];
        l.style.color = L[1];
      }
    }
  }
  
  if (d.w !== undefined) {
    S.wiz[d.w] = t.value;
  }
});

function showE(f, o) {
  f.querySelectorAll('.err').forEach(x => x.textContent = '');
  let ok = 1;
  for (const k in o) {
    if (o[k]) {
      const el = f.querySelector('#e-' + k);
      if (el) el.textContent = o[k];
      ok = 0;
    }
  }
  return ok;
}

document.addEventListener('submit', e => {

  const k = f.dataset.f;

  e.preventDefault();
  
  const v = n => f[n]?.value.trim();

  if (k == 'login') {

      email: !v('email') ? 'Email is required' : !mailOk(v('email')) ? 'Enter a valid email' : '',
      pw: !v('pw') ? 'Password is required' : ''
    })) {

    }

    if (showE(f, {
      name: !v('name') ? 'Full name is required' : '',

      phone: !v('phone') ? 'Phone is required' : '',
      loc: !v('loc') ? 'Location is required' : '',

        phone: v('phone'),
        loc: v('loc'),

        photo: '',

        conns: [],
        cdate: {},
        inc: [],
        sent: [],
        svc: [],
        chats: {},
        unread: {},
        chat: null,
        mchat: false,
        notes: [],

          n: S.user.name,
          l: S.user.loc.split(',')[0],
          r: S.user.role == 'Provider' ? 'Provider' : S.user.role == 'Seeker' ? 'Seeker' : 'Both',
          s: 'Active',
          j: TODAY

  if (k == 'admin') {

      S.admin = true;
      go('/admin');
    } else {
      showE(f, {pw: 'Invalid admin credentials'});
    }
  }
  
  if (k == 'search') {
    S.q = $('#q').value;
    re();
    $('#q')?.focus();
  }

  if (k == 'send') {

    const id = S.chat;

    re();

let lastH = null;

function decorate() {
  const h = location.hash || '#/';
  if (h === lastH) return;
  lastH = h;
  
  root.classList.add('enter');
  setTimeout(() => root.classList.remove('enter'), 700);
  
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count;
    const suf = el.dataset.suf || '';
    if (isNaN(to)) return;
    const t0 = performance.now();
    const tick = n => {
      const k = Math.min(1, (n - t0) / 1000);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(to * e).toLocaleString('en-US') + suf;
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  
  const rv = document.querySelectorAll('.rv');
  if (!rv.length) return;
  
  if (!('IntersectionObserver' in window)) {
    rv.forEach(x => x.classList.remove('rv'));
    return;
  }
  
  const io = new IntersectionObserver(es => {
    es.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
        setTimeout(() => {
          en.target.classList.remove('rv', 'in');
          en.target.style.transitionDelay = '';
        }, 1100);
      }
    });
  }, {threshold: .1});
  
  rv.forEach((x, i) => {
    x.style.transitionDelay = (i % 4) * 80 + 'ms';
    io.observe(x);
  });
}

async function handlePayment(amount, description) {
    // 1. Get User Phone Number (You MUST have an input for this)
    // If you don't have a phone input on this page, you must add one or get it from user profile
    const phoneNumber = prompt("Enter your phone number to pay (e.g., 0712345678):");
    
    if (!phoneNumber) {
        alert("Payment cancelled. Phone number is required.");
        return;
    }

    // 2. Get User ID (Assuming you store this in localStorage after login)
    const userId = localStorage.getItem('userId'); 
    if (!userId) {
        alert("Error: User not logged in.");
        return;
    }

    // 3. Send Request to Your Backend
    try {
        const response = await fetch('http://localhost:3000/api/payment/initiate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userId: userId,
                amount: amount,
                phoneNumber: phoneNumber,
                accountReference: description
            })
        });

        const data = await response.json();

        if (data.success) {
            if (data.isSimulation) {
                alert("SIMULATION: Payment request received. In a real environment, you would receive a PIN prompt now.");
            } else {
                alert("STK Push sent! Check your phone to enter your PIN.");
            }
            // Refresh page or update UI
            window.location.reload();
        } else {
            alert("Payment failed: " + (data.error || "Unknown error"));
        }
    } catch (error) {
        console.error('Payment error:', error);
        alert("Error connecting to payment server. Is the backend running?");
    }
}
